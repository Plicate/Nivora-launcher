[package]
name = "nivora-launcher"
version = "2.0.0"
description = "Nivora Launcher desktop shell"
authors = ["Nivora Launcher contributors"]
edition = "2021"

[lib]
name = "nivora_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
strip = "debuginfo"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
chrono = "0.4"
sha2 = "0.10"
libc = "0.2"
regex = "1"
base64 = "0.22"
uuid = { version = "1", default-features = false, features = ["v5"] }
url = "2"
sha1 = "0.10"
# проверка, создание и подпись плагинов через Ed25519
ed25519-dalek = "2"
ureq = { version = "2", default-features = false, features = ["tls", "gzip", "socks-proxy", "json"] }
# проверка TLS-сертификатов средствами ОС, включая CryptoAPI на Windows
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
zip = { version = "9", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.31", features = ["bundled", "hooks"] }
# чтение NBT-файлов с gzip-сжатием
flate2 = "1"
# импорт миров из tar и tar.gz
tar = "0.4"
# декодирование bzip2 и xz без C-зависимостей
bzip2-rs = "0.1"
lzma-rs = "0.3"
# создание PNG, ICO и ICNS для ярлыков
png = "0.17"
# облачная синхронизация разбирает PROPFIND-ответы и генерирует ключ манифеста
quick-xml = "0.42"
getrandom = "0.3"
# объявление Windows API в target-секции ломает передачу DEP_TAURI_DEV в build.rs
windows-sys = { version = "0.59", features = ["Win32_Security_Credentials", "Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Kernel", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_IO", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Com", "Win32_UI_Shell", "Win32_System_Time", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"

[patch.crates-io]
# требуется исправленная zip для распаковки архива обновления
tauri-plugin-updater = { path = "vendor/tauri-plugin-updater" }
