[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nivora-launcher"
version = "1.0.0"
description = "Nivora Launcher: a small universal Minecraft launcher"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=42", "defusedxml>=0.7.1", "psutil>=5.9"]
license = {text = "GPL-3.0-only"}
authors = [{name = "Nivora Launcher contributors"}]

[project.optional-dependencies]
windows = ["keyring>=25.0", "pywin32>=306"]

[project.scripts]
nivora-launcher = "nivora_launcher.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
nivora_launcher = ["vendor/*.pyz", "vendor/*.txt"]
