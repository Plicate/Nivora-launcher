name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build frontend
        working-directory: frontend
        run: npm run build

  desktop-windows:
    runs-on: windows-latest
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: 1.99.0
          build-warnings: allow
      - name: Install backend and freezer dependencies
        run: python -m pip install ".[windows]" pyinstaller
      - name: Run platform-specific Python tests
        run: python -m unittest discover -s tests -p test_platform_packaging.py -v
      - name: Build bundled Python backend
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile
          --name nivora-launcher-backend --paths . --distpath dist/backend
          --workpath build/pyinstaller-backend --specpath build/pyinstaller-backend
          --collect-all keyring
          --hidden-import keyring.backends.Windows
          --hidden-import truststore
          nivora_launcher/backend_entrypoint.py
      - name: Smoke-test packaged CLI mode
        shell: pwsh
        run: |
          & dist/backend/nivora-launcher-backend.exe --cli --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage backend resource
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force frontend/src-tauri/resources/backend | Out-Null
          Copy-Item dist/backend/nivora-launcher-backend.exe frontend/src-tauri/resources/backend/
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Generate Tauri icons
        working-directory: frontend
        run: npm run tauri -- icon src/assets/uni.png --output src-tauri/icons
      - name: Build Windows installers
        working-directory: frontend
        run: npm run desktop:build -- --bundles nsis,msi -- --locked
      - name: Run Tauri Rust tests
        working-directory: frontend/src-tauri
        run: cargo test --locked
      - name: Upload Windows installers
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nivora-launcher-windows
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  attest-windows:
    if: github.event_name == 'push'
    needs: desktop-windows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Attest Windows installers
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: nivora-launcher-windows
          subject-digest: sha256:${{ needs.desktop-windows.outputs.artifact-digest }}

  desktop-linux-packages:
    runs-on: ubuntu-24.04
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: 1.99.0
          build-warnings: allow
      - name: Install Tauri and RPM build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev libssl-dev libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev patchelf rpm
      - name: Install backend freezer dependency
        run: python -m pip install . pyinstaller
      - name: Build bundled Python backend
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile
          --name nivora-launcher-backend --paths . --distpath dist/backend
          --workpath build/pyinstaller-backend --specpath build/pyinstaller-backend
          --add-data nivora_launcher/vendor/bedrock-on-linux-2.2.9.pyz:nivora_launcher/vendor
          --add-data nivora_launcher/vendor/LICENSE-BedrockOnLinux.txt:nivora_launcher/vendor
          nivora_launcher/backend_entrypoint.py
      - name: Smoke-test packaged CLI mode
        run: dist/backend/nivora-launcher-backend --cli --help
      - name: Stage backend resource
        run: |
          mkdir -p frontend/src-tauri/resources/backend
          install -m 755 dist/backend/nivora-launcher-backend frontend/src-tauri/resources/backend/
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Generate Tauri icons
        working-directory: frontend
        run: npm run tauri -- icon src/assets/uni.png --output src-tauri/icons
      - name: Build Debian and Fedora packages
        working-directory: frontend
        run: npm run desktop:build -- --bundles deb,rpm -- --locked
      - name: Run Tauri Rust tests
        working-directory: frontend/src-tauri
        run: cargo test --locked
      - name: Upload Linux packages
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nivora-launcher-linux
          path: |
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  attest-linux:
    if: github.event_name == 'push'
    needs: desktop-linux-packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Attest Linux packages
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: nivora-launcher-linux
          subject-digest: sha256:${{ needs.desktop-linux-packages.outputs.artifact-digest }}
